<g fill="none" stroke-linecap="round"><g transform="translate(340 340)" stroke="#ffdca0" stroke-width="5"><path d="M0 -190 V-130 M0 130 V190 M-190 0 H-130 M130 0 H190 M-134 -134 L-92 -92 M92 92 L134 134 M-134 134 L-92 92 M92 -92 L134 -134"/><path d="M0 -235 V-215 M0 215 V235 M-235 0 H-215 M215 0 H235" stroke="#efbdd4" stroke-width="3"/></g><g transform="translate(900 255)" stroke="#e6d4ff" stroke-width="4"><path d="M0 -150 V-105 M0 105 V150 M-150 0 H-105 M105 0 H150 M-106 -106 L-74 -74 M74 74 L106 106 M-106 106 L-74 74 M74 -74 L106 -106"/></g><g transform="translate(1450 350)" stroke="#ffd68d" stroke-width="5"><path d="M0 -210 V-145 M0 145 V210 M-210 0 H-145 M145 0 H210 M-148 -148 L-102 -102 M102 102 L148 148 M-148 148 L-102 102 M102 -102 L148 -148"/><path d="M0 -250 V-230 M0 230 V250 M-250 0 H-230 M230 0 H250" stroke="#f0b5d0" stroke-width="3"/></g></g>
