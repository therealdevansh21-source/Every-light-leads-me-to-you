 <path d="M910 855 L1100 690 1290 855 V1120 H910Z" fill="#45365d"/><path d="M885 860 L1100 650 1315 860" fill="none" stroke="#d69aa7" stroke-width="18"/>
 <path d="M1320 860 L1555 665 1790 860 V1120 H1320Z" fill="#3d355b"/><path d="M1290 865 L1555 625 1820 865" fill="none" stroke="#e3a6a9" stroke-width="18"/>
</g>
<g fill="url(#windows)" stroke="#f2c88f" stroke-width="7"><rect x="65" y="880" width="70" height="115" rx="32"/><rect x="225" y="880" width="70" height="115" rx="32"/><rect x="480" y="875" width="76" height="125" rx="34"/><rect x="680" y="875" width="76" height="125" rx="34"/><rect x="975" y="880" width="72" height="120" rx="33"/><rect x="1150" y="880" width="72" height="120" rx="33"/><rect x="1390" y="880" width="76" height="125" rx="34"/><rect x="1630" y="880" width="76" height="125" rx="34"/></g>
