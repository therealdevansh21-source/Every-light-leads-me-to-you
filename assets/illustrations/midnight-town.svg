<g fill="#fff0bd"><circle cx="470" cy="180" r="7"/><circle cx="515" cy="410" r="5"/><circle cx="790" cy="440" r="6"/><circle cx="1110" cy="130" r="5"/><circle cx="1270" cy="500" r="6"/><circle cx="1600" cy="570" r="7"/><circle cx="200" cy="550" r="5"/><circle cx="1030" cy="510" r="4"/></g>
