<g fill="#302c52" opacity=".8"><path d="M0 780 L110 720 210 775 330 670 430 780 520 715 620 780 730 660 835 780 940 700 1050 780 1170 655 1280 780 1400 700 1510 780 1630 650 1745 780 1800 750 V1200 H0Z"/></g>
