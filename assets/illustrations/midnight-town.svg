<g fill="#d58b66"><path d="M300 1130 Q330 1106 360 1130 Q330 1157 300 1130Z"/><path d="M1450 1128 Q1480 1104 1510 1128 Q1480 1155 1450 1128Z"/></g><g fill="#ffe6a1"><path d="M330 1097 Q312 1120 330 1128 Q348 1120 330 1097Z"/><path d="M1480 1095 Q1462 1118 1480 1126 Q1498 1118 1480 1095Z"/></g>
