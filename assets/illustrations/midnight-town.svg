<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#202342"/><stop offset=".45" stop-color="#38325f"/><stop offset=".78" stop-color="#5a426e"/><stop offset="1" stop-color="#9a637d"/></linearGradient>
 <radialGradient id="burst"><stop stop-color="#fff8d6"/><stop offset=".15" stop-color="#ffdf9a"/><stop offset=".5" stop-color="#ee9fc3" stop-opacity=".72"/><stop offset="1" stop-color="#ee9fc3" stop-opacity="0"/></radialGradient>
 <radialGradient id="burst2"><stop stop-color="#fff6d6"/><stop offset=".2" stop-color="#f7c987"/><stop offset=".55" stop-color="#b9a1e6" stop-opacity=".56"/><stop offset="1" stop-color="#b9a1e6" stop-opacity="0"/></radialGradient>
 <linearGradient id="windows" x2="0" y2="1"><stop stop-color="#fff0b5"/><stop offset="1" stop-color="#e8a85f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
</defs>
<rect width="1800" height="1200" fill="url(#sky)"/>
